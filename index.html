<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flashcards (Simple + Working)</title>
  <style>
    body{font-family:system-ui;margin:24px;background:#0b1020;color:#eaf0ff}
    h1{margin:0 0 6px;font-size:22px}
    .sub{opacity:.75;margin:0 0 16px}
    select,button,input,textarea{padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#eaf0ff}
    button{cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .card{margin-top:16px;padding:18px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);min-height:180px}
    .label{opacity:.75;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    .text{margin-top:10px;font-size:24px;white-space:pre-wrap}
    .meta{margin-top:10px;opacity:.7;font-size:13px}
    .panel{margin-top:18px;padding:14px;border:1px solid rgba(255,255,255,.2);border-radius:16px;background:rgba(255,255,255,.04)}
    textarea{width:100%;min-height:80px}
  </style>
</head>
<body>
  <h1>Flashcards</h1>
  <p class="sub">
    Simple version. Flip always changes text live. Uses saved data key:
    <code>finals_flashcards_decks_v2</code>
  </p>

  <div class="row">
    <label>
      Deck:
      <select id="deckSelect"></select>
    </label>
    <button id="btnPrev">Prev</button>
    <button id="btnFlip">Flip</button>
    <button id="btnNext">Next</button>
  </div>

  <div class="card" id="card" role="button" aria-label="flashcard">
    <div class="label" id="face">—</div>
    <div class="text" id="text">Loading…</div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="panel">
    <div class="row">
      <button id="btnBackup">Backup deck (download JSON)</button>
      <button id="btnImport">Import deck JSON</button>
      <input id="importFile" type="file" accept="application/json" style="display:none" />
    </div>
    <p class="sub" style="margin:10px 0 0">
      Tip: Space flips, Arrow keys move.
    </p>
  </div>

<script>
(() => {
  const STORAGE_KEY = "finals_flashcards_decks_v2";

  let state = { decks: [], selectedDeckId: null };
  let deck = null;
  let index = 0;
  let showing = "q"; // "q" or "a"

  const deckSelect = document.getElementById("deckSelect");
  const face = document.getElementById("face");
  const text = document.getElementById("text");
  const meta = document.getElementById("meta");
  const btnPrev = document.getElementById("btnPrev");
  const btnFlip = document.getElementById("btnFlip");
  const btnNext = document.getElementById("btnNext");
  const card = document.getElementById("card");

  const btnBackup = document.getElementById("btnBackup");
  const btnImport = document.getElementById("btnImport");
  const importFile = document.getElementById("importFile");

  const uid = () => Math.random().toString(16).slice(2) + Date.now().toString(16);

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      state = raw ? JSON.parse(raw) : { decks: [], selectedDeckId: null };
      state.decks = Array.isArray(state.decks) ? state.decks : [];
    } catch {
      state = { decks: [], selectedDeckId: null };
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  function setDeckById(id) {
    deck = state.decks.find(d => d.id === id) || state.decks[0] || null;
    index = 0;
    showing = "q";
    if (deck) {
      state.selectedDeckId = deck.id;
      saveState();
    }
    render();
  }

  function currentCard() {
    if (!deck || !Array.isArray(deck.cards) || deck.cards.length === 0) return null;
    if (index < 0) index = 0;
    if (index >= deck.cards.length) index = deck.cards.length - 1;
    return deck.cards[index];
  }

  function render() {
    const c = currentCard();

    if (!deck) {
      deckSelect.innerHTML = `<option value="">No decks found</option>`;
      face.textContent = "No deck";
      text.textContent = "Import a deck JSON, then select it.";
      meta.textContent = "";
      btnPrev.disabled = btnFlip.disabled = btnNext.disabled = true;
      return;
    }

    if (!c) {
      face.textContent = "Empty deck";
      text.textContent = "This deck has no cards.";
      meta.textContent = deck.name || "Deck";
      btnPrev.disabled = btnFlip.disabled = btnNext.disabled = true;
      return;
    }

    btnPrev.disabled = btnFlip.disabled = btnNext.disabled = false;

    face.textContent = (showing === "q") ? "Question" : "Answer";
    text.textContent = (showing === "q") ? c.question : c.answer;
    meta.textContent = `${deck.name || "Deck"} — card ${index + 1} of ${deck.cards.length}`;
  }

  function flip() {
    // THIS is the simple “make text change live”
    if (!currentCard()) return;
    showing = (showing === "q") ? "a" : "q";
    render();
  }

  function next() {
    if (!currentCard()) return;
    index = Math.min(deck.cards.length - 1, index + 1);
    showing = "q";
    render();
  }

  function prev() {
    if (!currentCard()) return;
    index = Math.max(0, index - 1);
    showing = "q";
    render();
  }

  function downloadJson(filename, obj) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // Import (adds deck to state)
  function importDeckObject(parsed) {
    const incoming = parsed.deck || parsed; // accept {deck:{...}} or just deck
    if (!incoming || !Array.isArray(incoming.cards)) {
      alert("Not a valid deck JSON (missing cards).");
      return;
    }

    const cleaned = {
      id: (typeof incoming.id === "string" && incoming.id) ? incoming.id : uid(),
      name: (typeof incoming.name === "string" && incoming.name) ? incoming.name : "Imported deck",
      cards: incoming.cards
        .filter(c => c && typeof c.question === "string" && typeof c.answer === "string")
        .map(c => ({
          id: (typeof c.id === "string" && c.id) ? c.id : uid(),
          topic: typeof c.topic === "string" ? c.topic : "",
          difficulty: ["Easy","Medium","Hard"].includes(c.difficulty) ? c.difficulty : "Medium",
          question: c.question,
          answer: c.answer,
          stats: {
            know: Number(c.stats?.know ?? 0) || 0,
            dont: Number(c.stats?.dont ?? 0) || 0
          }
        }))
    };

    if (state.decks.some(d => d.id === cleaned.id)) cleaned.id = uid();
    state.decks.push(cleaned);
    state.selectedDeckId = cleaned.id;
    saveState();
    initDeckSelect();
    setDeckById(cleaned.id);
    alert(`Imported "${cleaned.name}" (${cleaned.cards.length} cards).`);
  }

  function initDeckSelect() {
    if (state.decks.length === 0) {
      deckSelect.innerHTML = `<option value="">No decks found</option>`;
      return;
    }
    deckSelect.innerHTML = state.decks.map(d => `<option value="${d.id}">${d.name || "Untitled deck"}</option>`).join("");
  }

  // Events
  btnFlip.addEventListener("click", (e) => { e.preventDefault(); flip(); });
  card.addEventListener("click", flip);
  btnNext.addEventListener("click", (e) => { e.preventDefault(); next(); });
  btnPrev.addEventListener("click", (e) => { e.preventDefault(); prev(); });

  deckSelect.addEventListener("change", () => setDeckById(deckSelect.value));

  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (e.code === "Space") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
  });

  btnBackup.addEventListener("click", () => {
    if (!deck) return alert("No deck selected.");
    downloadJson((deck.name || "deck").replace(/[^\w\-]+/g,"_") + "_BACKUP.json", {
      exported_at: new Date().toISOString(),
      deck
    });
  });

  btnImport.addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", async () => {
    const file = importFile.files && importFile.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      importDeckObject(JSON.parse(text));
    } catch {
      alert("Could not read that JSON file.");
    }
    importFile.value = "";
  });

  // Init
  loadState();
  initDeckSelect();

  const initial =
    (state
